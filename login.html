<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Simone OS — Accesso</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--ebony); }
    .login-box {
      background: white; width: 380px; padding: 40px;
      border-radius: 4px; box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }
    .login-logo { text-align:center; margin-bottom:32px; }
    .login-logo svg { fill:var(--coral); width:32px; height:32px; }
    .login-title { font-family:var(--editorial); font-size:22px; text-align:center; margin-bottom:4px; }
    .login-sub { font-family:var(--editorial); font-style:italic; font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:28px; }
    .login-error { color:var(--coral); font-size:13px; font-family:var(--editorial); margin-bottom:12px; display:none; }
    .login-note { font-size:13px; font-family:var(--editorial); color:var(--text-secondary); margin-bottom:16px; }
    form[hidden] { display:none; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
  </div>
  <div class="login-title">De Simone OS</div>
  <div class="login-sub">Torre del Greco · Dal 1830</div>
  <div class="login-error" id="loginError" role="alert"></div>
  <form id="loginForm" novalidate>
    <div class="form-field" style="margin-bottom:16px;">
      <label class="field-label" for="emailInput" id="loginLabel">Email</label>
      <input type="email" id="emailInput" class="field-input" placeholder="nome@desimone.it" autocomplete="username">
    </div>
    <div class="form-field" style="margin-bottom:24px;">
      <label class="field-label" for="passwordInput">Password</label>
      <input type="password" id="passwordInput" class="field-input" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-primary" id="loginBtn" style="width:100%;justify-content:center;">Accedi</button>
  </form>
  <!-- Con una password provvisoria non si entra: si sceglie la propria (scheda 1.4, decisione 4) -->
  <form id="newPasswordForm" novalidate hidden>
    <p class="login-note">Questa password è provvisoria. Scegline una tua per entrare: almeno 8 caratteri.</p>
    <div class="form-field" style="margin-bottom:16px;">
      <label class="field-label" for="newPassword">Password nuova</label>
      <input type="password" id="newPassword" class="field-input" autocomplete="new-password">
    </div>
    <div class="form-field" style="margin-bottom:24px;">
      <label class="field-label" for="newPasswordRepeat">Ripeti la password nuova</label>
      <input type="password" id="newPasswordRepeat" class="field-input" autocomplete="new-password">
    </div>
    <button type="submit" class="btn-primary" id="newPasswordBtn" style="width:100%;justify-content:center;">Salva e accedi</button>
  </form>
</div>

<script src="config.js"></script>
<script type="module">
  import { IN_SEDE, ACCOUNT_DISABLED, signIn, getMyAccount, changeMyPassword, supabase } from './js/supabase.js'

  const $ = id => document.getElementById(id)
  const DISABLED_MESSAGE = 'Account disattivato: chiedi all\'amministrazione.'

  function showError(message) {
    $('loginError').textContent = message
    $('loginError').style.display = message ? 'block' : 'none'
  }

  // Nella sede si entra con un nome utente, come in STEP (decisione 3). Su Supabase, solo per lo sviluppo, resta l'email
  if (IN_SEDE) {
    $('loginLabel').textContent = 'Nome utente'
    $('emailInput').type = 'text'
    $('emailInput').placeholder = 'nome'
    $('emailInput').autocapitalize = 'none'
    $('emailInput').spellcheck = false
  }
  if (new URLSearchParams(location.search).get('motivo') === 'disattivato') showError(DISABLED_MESSAGE)

  // Dopo l'accesso: il dev va alle anagrafiche. Su Supabase un account disattivato si scopre solo qui
  async function enter(login, password) {
    await signIn(login, password)
    let role = null
    try {
      role = (await getMyAccount())?.role
    } catch (err) {
      if (err.code === ACCOUNT_DISABLED) {
        await supabase.auth.signOut()
        throw Object.assign(new Error(DISABLED_MESSAGE), { code: 'account_disattivato' })
      }
    }
    window.location.href = role === 'dev' ? '/anagrafiche.html' : '/catalog.html'
  }

  function loginMessage(err) {
    if (err.code === 'account_disattivato') return DISABLED_MESSAGE
    if (!IN_SEDE) return 'Email o password non validi.'
    return err instanceof TypeError ? 'Il servizio della sede non risponde.' : `${err.message}.`
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault()
    const btn = $('loginBtn')
    btn.textContent = 'Accesso...'
    btn.disabled = true
    showError('')
    try {
      await enter($('emailInput').value, $('passwordInput').value)
    } catch (err) {
      btn.textContent = 'Accedi'
      btn.disabled = false
      if (err.code === 'password_provvisoria') {
        $('loginForm').hidden = true
        $('newPasswordForm').hidden = false
        $('newPassword').focus()
      } else {
        showError(loginMessage(err))
      }
    }
  })

  $('newPasswordForm').addEventListener('submit', async e => {
    e.preventDefault()
    const next = $('newPassword').value
    showError('')
    if (next.length < 8) return showError('La password deve avere almeno 8 caratteri.')
    if (next !== $('newPasswordRepeat').value) return showError('Le due password non coincidono.')
    const btn = $('newPasswordBtn')
    btn.disabled = true
    try {
      await changeMyPassword($('emailInput').value, $('passwordInput').value, next)
      await enter($('emailInput').value, next)
    } catch (err) {
      btn.disabled = false
      showError(err instanceof TypeError ? 'Il servizio della sede non risponde.' : `${err.message}.`)
    }
  })
</script>
</body>
</html>
