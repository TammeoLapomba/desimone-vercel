<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>De Simone OS — Modifica Articolo</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1814">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="De Simone">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <style>
    .editor-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .topbar-actions { margin-left: auto; display: flex; gap: 12px; }
    @media (max-width: 768px) { .topbar-actions { gap: 6px; } }
    .editor-title {
      font-family: var(--editorial);
      font-size: 16px;
      color: var(--coral-pink);
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 8px;
    }
  </style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" aria-label="Navigazione principale">
    <div class="sidebar-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>
    <nav class="sidebar-nav" aria-label="Menu">
      <a href="/catalog.html" class="nav-item active" title="Montato">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="nav-item-label">Montato</span>
      </a>
      <a href="/semilavorato.html" class="nav-item" title="Semilavorato">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span class="nav-item-label">Semilavorato</span>
      </a>
      <a href="/movimenti.html" class="nav-item" title="Movimenti">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span class="nav-item-label">Movimenti</span>
      </a>
      <a href="/giacenze.html" class="nav-item" title="Giacenze">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
        <span class="nav-item-label">Giacenze</span>
      </a>
      <a href="/registro.html" class="nav-item" title="Registro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="5" cy="6" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="18" r="1"/></svg>
        <span class="nav-item-label">Registro</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-account" onclick="window.signOutUser()" aria-label="Esci dall'account">ADS</button>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <main class="main" style="padding: 0; overflow-y: auto;">
    <div class="topbar" style="border-bottom: 1px solid rgba(255,255,255,0.08); padding: 0 32px;">
      <a href="/catalog.html" style="color:var(--text-muted); text-decoration:none; display:flex; align-items:center; gap:8px; font-family:var(--editorial); font-size:14px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg> Torna al catalogo
      </a>
      <div class="topbar-actions">
        <button class="btn-danger" id="btnDelete" style="display:none;" aria-label="Archivia o elimina">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          <span class="topbar-hide-mobile" id="btnDeleteLabel">Archivia o elimina</span>
        </button>
        <button class="btn-ghost" id="btnCancel">Annulla</button>
        <button class="btn-primary btn-success" id="btnSave">Salva Modifiche</button>
      </div>
    </div>

    <div style="max-width: 720px; margin: 40px auto; padding: 0 16px 120px; " class="editor-content">
      <h1 style="font-family:var(--editorial); font-size:28px; font-weight:400; line-height:1.3; margin-bottom:8px;" id="headerName">Modifica Articolo</h1>
      <p style="font-family:var(--mono); fill:var(--text-muted); font-size:12px; margin-bottom:32px; color:var(--text-muted);"><span id="headerSku">Caricamento...</span> <span class="code-tag" id="headerCodeTag" hidden>Provvisorio</span></p>

      <div class="editor-section">
        <div class="editor-title">Foto</div>
        <div id="f_gallery"></div>
      </div>

      <div class="editor-section">
        <div class="editor-title">Identità</div>
        <div class="form-row full">
          <div class="form-field">
            <label class="field-label" for="f_title">Titolo <span class="field-required">*</span></label>
            <input type="text" class="field-input" id="f_title">
          </div>
        </div>
        <div class="form-row full">
          <div class="form-field">
            <label class="field-label">Collezione <span class="field-required">*</span></label>
            <select class="field-select" id="f_collection"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="field-label">Tipo prodotto <span class="field-required">*</span></label>
            <select class="field-select" id="f_type"></select>
          </div>
          <div class="form-field">
            <label class="field-label">Codice</label>
            <input type="text" class="field-input" id="f_sku" disabled style="background:rgba(255,255,255,0.02); color:var(--text-muted);">
            <span class="field-hint" id="codeStatus"></span>
          </div>
        </div>
        <div class="form-row full" style="margin-top:16px;">
          <div class="form-field">
            <label class="field-label">Note interne</label>
            <textarea class="field-input field-textarea" id="f_notes" rows="3"></textarea>
          </div>
        </div>
      </div>

      <div class="editor-section">
        <div class="editor-title">Materiali & Prezzi</div>
        <div class="form-row full">
          <div class="form-field">
            <label class="field-label">Materiali <span class="field-required">*</span></label>
            <div id="f_materials"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label class="field-label">Metallo</label>
            <select class="field-select" id="f_metal"></select>
          </div>
          <div class="form-field" id="f_metal_grams_field" hidden>
            <label class="field-label" for="f_metal_grams">Peso del metallo (g)</label>
            <input type="text" class="field-input" id="f_metal_grams" inputmode="decimal" autocomplete="off" data-virgola>
            <span class="field-hint">Per il cartellino. Non cambia il peso totale.</span>
          </div>
        </div>
        <div class="form-row" style="margin-top:16px;">
          <div class="form-field">
            <label class="field-label">Prezzo retail (€) <span class="field-required">*</span></label>
            <input type="text" class="field-input" id="f_price_retail" inputmode="decimal" autocomplete="off" data-virgola>
          </div>
          <div class="form-field">
            <label class="field-label">Prezzo ingrosso (€)</label>
            <input type="text" class="field-input" id="f_price_wholesale" inputmode="decimal" autocomplete="off" data-virgola>
          </div>
        </div>
      </div>

      <div class="editor-section">
        <div class="editor-title">Misure & Magazzino</div>
        <div class="form-row triple">
          <div class="form-field">
            <label class="field-label">Giacenza</label>
            <input type="text" class="field-input" id="f_stock" value="—" readonly
                   title="Somma dei movimenti: si cambia solo con un movimento">
            <a class="field-hint" id="f_stock_link" href="/movimenti.html">Movimenta →</a>
          </div>
          <div class="form-field">
            <label class="field-label">Peso totale di un pezzo (g) <span class="field-required">*</span></label>
            <input type="text" class="field-input" id="f_weight" inputmode="decimal" autocomplete="off" placeholder="0,0" data-virgola>
            <div class="field-hint">I movimenti pesano pezzi × questo peso. Senza, non si carica.</div>
          </div>
          <div class="form-field"></div>
        </div>
        <div class="form-row triple" style="margin-top:16px;">
          <div class="form-field">
            <label class="field-label">Larghezza (cm)</label>
            <input type="text" class="field-input" id="f_width" inputmode="decimal" autocomplete="off" data-virgola>
          </div>
          <div class="form-field">
            <label class="field-label">Lunghezza (cm)</label>
            <input type="text" class="field-input" id="f_length" inputmode="decimal" autocomplete="off" data-virgola>
          </div>
          <div class="form-field">
            <label class="field-label">Altezza (cm)</label>
            <input type="text" class="field-input" id="f_height" inputmode="decimal" autocomplete="off" data-virgola>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="config.js"></script>
<script src="js/bilancia/pesi.js"></script>
<script type="module" src="js/article.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
