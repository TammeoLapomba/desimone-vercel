<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>De Simone OS — Cliente</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1814">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="De Simone">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <meta name="description" content="Atelier Antonino De Simone — Cliente">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/movimenti.css">
  <link rel="stylesheet" href="css/giacenze.css">
  <link rel="stylesheet" href="css/scheda.css">
  <link rel="stylesheet" href="css/vendite.css">
</head>
<body>
<a href="#cliente-main" class="skip-link">Vai al contenuto principale</a>
<div id="toast" role="status" aria-live="polite"></div>
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" aria-label="Navigazione principale">
    <div class="sidebar-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    </div>
    <nav class="sidebar-nav" aria-label="Menu">
      <a href="/catalog.html" class="nav-item" title="Montato">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="nav-item-label">Montato</span>
      </a>
      <a href="/semilavorato.html" class="nav-item" title="Semilavorato">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span class="nav-item-label">Semilavorato</span>
      </a>
      <a href="/movimenti.html" class="nav-item" title="Movimenti">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span class="nav-item-label">Movimenti</span>
      </a>
      <a href="/giacenze.html" class="nav-item" title="Giacenze">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
        <span class="nav-item-label">Giacenze</span>
      </a>
      <a href="/registro.html" class="nav-item" title="Registro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="5" cy="6" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="18" r="1"/></svg>
        <span class="nav-item-label">Registro</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="sidebar-account" onclick="window.signOutUser()" aria-label="Esci dall'account">ADS</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="cliente-main">
    <div class="topbar" role="toolbar" aria-label="Scheda del cliente">
      <a class="sch-back" href="/vendite.html">← Vendite</a>
      <div class="mov-topbar-meta">
        <span class="mov-chip" id="operatorChip" aria-live="polite"></span>
      </div>
    </div>

    <div class="catalog-area">
      <div class="mov-blocked" id="blocked" hidden></div>

      <div class="sch-layout" id="scheda" hidden>
        <section class="mov-card" id="identity" aria-label="Cliente"></section>

        <div class="sch-column">
          <section class="mov-card" aria-labelledby="dataTitle">
            <div class="gia-card-head">
              <h2 class="mov-card-title" id="dataTitle">Dati</h2>
              <button type="button" class="btn-ghost" id="btnEditCustomer">Modifica</button>
            </div>
            <div id="data"></div>
          </section>
          <section class="mov-card" aria-labelledby="sitesTitle">
            <div class="gia-card-head">
              <h2 class="mov-card-title" id="sitesTitle">Sedi</h2>
              <button type="button" class="btn-ghost" id="btnNewSite">Nuova sede</button>
            </div>
            <ul class="gia-list gia-users" id="sites"></ul>
          </section>
          <!-- Merce presso il cliente (4.2), bolle (4.3) e ordini (4.6) si aggiungeranno qui (RV-U-06) -->
          <section class="mov-card" aria-labelledby="changesTitle">
            <h2 class="mov-card-title" id="changesTitle">Storico delle modifiche</h2>
            <div id="changes"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="customerModal" role="dialog" aria-modal="true" aria-labelledby="customerModalTitle">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-eyebrow">Cliente</div>
        <div class="modal-title" id="customerModalTitle">Modifica i dati</div>
      </div>
      <button type="button" class="cli-close" data-close="customerModal" aria-label="Chiudi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form id="customerForm" novalidate>
      <div class="modal-body">
        <div id="customerFields"></div>
        <div class="field-error" id="customerError" role="alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" data-close="customerModal">Annulla</button>
        <button type="submit" class="btn-primary" id="customerSave">Salva</button>
      </div>
    </form>
  </div>
</div>
<div class="modal-overlay" id="siteModal" role="dialog" aria-modal="true" aria-labelledby="siteModalTitle">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-eyebrow">Sede</div>
        <div class="modal-title" id="siteModalTitle">Nuova sede</div>
      </div>
      <button type="button" class="cli-close" data-close="siteModal" aria-label="Chiudi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form id="siteForm" novalidate>
      <div class="modal-body">
        <div id="siteFields"></div>
        <div class="field-error" id="siteError" role="alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-ghost" data-close="siteModal">Annulla</button>
        <button type="submit" class="btn-primary" id="siteSave">Salva</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script type="module" src="js/cliente.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
